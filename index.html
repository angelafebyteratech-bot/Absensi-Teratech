<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi PT Teratech Data Inti</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f9f9f9;">
  <h2 style="color: #333;">Mengambil Lokasi Presisi...</h2>
  <p style="color: #666;">Mohon klik <b>ALLOW / IZINKAN</b> saat browser meminta akses lokasi HP Anda.</p>

  <script>
    const googleFormBaseUrl = "https://docs.google.com/forms/d/e/1FAIpQLScf-_9XTxWAp6fCLRbdaNGb8FtEk0FF_SvCm9cyAMaVCnArJg/viewform?usp=pp_url&entry.257924140=";

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const mapsUrl = `https://maps.google.com/?q=${lat},${lng}`;
          
          // Request nama alamat dari koordinat GPS
          fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
            .then(response => response.json())
            .then(data => {
              const address = data.display_name || "Alamat tidak ditemukan";
              
              // Gabungin: Alamat teks, Koordinat angka, sama Link Maps
              const fullLocation = `Alamat: ${address} \nKoordinat: ${lat}, ${lng} \nMaps: ${mapsUrl}`;
              
              window.location.href = googleFormBaseUrl + encodeURIComponent(fullLocation);
            })
            .catch(error => {
              // Kalau gagal fetch alamat, fallback tetap kirim koordinat + maps
              const fallbackLocation = `Koordinat: ${lat}, ${lng} \nMaps: ${mapsUrl}`;
              window.location.href = googleFormBaseUrl + encodeURIComponent(fallbackLocation);
            });
        },
        function(error) {
          alert("Gagal mengambil lokasi. Mohon pastikan GPS HP aktif dan klik Izinkan/Allow lokasi pada browser.");
        },
        { enableHighAccuracy: true }
      );
    } else {
      alert("Browser lo tidak mendukung fitur Geolocation.");
    }
  </script>
</body>
</html>
